name: Plugin release

on:
  push:
    tags: ["[0-9]*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: obsidianmd/obsidian-workflows@8167caed39664214d82c86fdfa32e06d8d55f61d
        with:
          mode: release
          strict: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Resolve version
        id: meta
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::manifest.json names $version, the tag is $GITHUB_REF_NAME"
            exit 1
          fi
          bundle="$(node -p "Object.keys(require('./package.json').dependencies)[0]")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "res_tag=res-$version" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./manifest.json').name")" >> "$GITHUB_OUTPUT"
          echo "resources=node_modules/$bundle/resources" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Create Resource Release
        run: |
          if ! gh release view "${{ steps.meta.outputs.res_tag }}" >/dev/null 2>&1; then
            notes=$(printf '%s\n\n%s\n%s' \
              "Runtime resources for ${{ steps.meta.outputs.name }} v${{ steps.meta.outputs.version }}: @@RESOURCES@@." \
              "The installed plugin downloads these on its own. There is nothing to install by hand." \
              "Get the plugin from the ${{ steps.meta.outputs.version }} release.")
            gh release create "${{ steps.meta.outputs.res_tag }}" \
              --title "${{ steps.meta.outputs.res_tag }}" \
              --target "${{ github.sha }}" \
              --notes "$notes" \
              ${{ steps.meta.outputs.prerelease == 'true' && '--prerelease' || '' }} \
              --latest=false
          fi
          gh release upload "${{ steps.meta.outputs.res_tag }}" \
            "${{ steps.meta.outputs.resources }}"/* --clobber

      - name: Verify resources
        run: |
          download_dir="$(mktemp -d)"
          for resource in "${{ steps.meta.outputs.resources }}"/*; do
            file_name="${resource##*/}"
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.meta.outputs.res_tag }}/$file_name"
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error --location \
                --header "Cache-Control: no-cache" \
                --output "$download_dir/$file_name" \
                "$url" &&
                cmp --silent "$resource" "$download_dir/$file_name"; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error file=$resource::Anonymous download did not match the resource"
                exit 1
              fi
              sleep 2
            done
          done

      - name: Attest resources
        uses: actions/attest@v4
        with:
          subject-path: |
            manifest.json
            ${{ steps.meta.outputs.resources }}/*

      - name: Publish release
        run: |
          @@RELEASE_NOTES@@
          gh release edit "${{ steps.meta.outputs.version }}" \
            --draft=false \
            --notes "$notes" \
            ${{ steps.meta.outputs.prerelease == 'true' && '--prerelease --latest=false' || '--latest' }}
