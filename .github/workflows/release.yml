name: Release

# Publishes each product whose version on `main`, the one trunk, has no
# release tag yet. The version picks the line: a pre-release is a beta, any
# other version a stable release (ADR 0097). The products publish to the
# publish repository, aidenlx/zotlit (RELEASE_REPOSITORY in
# packages/config/repositories.ts); ZotLit Reader and the Resource Pack each
# publish to their own (PUBLISHED_PLUGINS in
# packages/scripts/lib/shell/plugins.ts):
#
#   obsidian  the npm bundle package, then the shell commit and the version
#             tag in aidenlx/zotlit, whose own workflow builds and releases
#             the plugin; then the same tag here
#   zotero    the zt-<version> release and the rolling update channel in
#             aidenlx/zotlit; then the same tag here
#   reader    as obsidian, in aidenlx/zotlit-reader; then reader-<version>
#             here
#   resources as obsidian, in aidenlx/zotlit-resources, with main.js copied
#             byte for byte; then resources-<version> here
#   docs      after a stable version, the production docs site from its tag
#             (docs-deploy.yml)
#
# The steps live in packages/scripts/lib/release/ and run the same way from
# a machine (`pnpm release:publish`). Each skips what an earlier run did, so
# a run that failed half way runs again with workflow_dispatch. See
# CONTRIBUTING.md "Releasing".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The release tags of this repository are the gate: a push whose versions
  # are tagged stops here, before any dependency is installed. A dispatch
  # publishes from main alone; a stable hotfix publishes from a machine.
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      obsidian: ${{ steps.plan.outputs.obsidian }}
      zotero: ${{ steps.plan.outputs.zotero }}
      reader: ${{ steps.plan.outputs.reader }}
      resources: ${{ steps.plan.outputs.resources }}
      docs-tag: ${{ steps.plan.outputs.docs-tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          bootstrap: "false"

      - name: Find unreleased versions
        id: plan
        run: node packages/scripts/scripts/release-plan.ts >> "$GITHUB_OUTPUT"

  # The release gate on the tree that ships. Its desktop checks skip here;
  # `pnpm release` ran them in its Land Turn.
  verify:
    needs: plan
    if: needs.plan.outputs.obsidian == 'true' || needs.plan.outputs.zotero == 'true' || needs.plan.outputs.reader == 'true' || needs.plan.outputs.resources == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Release gate
        run: pnpm verify --release

  obsidian:
    needs: [plan, verify]
    if: needs.plan.outputs.obsidian == 'true'
    runs-on: ubuntu-latest
    permissions:
      # The release tag of this repository.
      contents: write
      # npm trusted publishing and its provenance statement.
      id-token: write
    steps:
      # The full history: the run checks that it builds a commit of main.
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Publish
        run: pnpm release:publish obsidian
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}

  zotero:
    needs: [plan, verify]
    if: needs.plan.outputs.zotero == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Publish
        id: publish
        run: pnpm release:publish zotero
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}

      # The XPI and the channel manifests this run wrote
      # (apps/zotero/scripts/build-update-json.ts).
      - name: Attest provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.publish.outputs.attest }}

  reader:
    needs: [plan, verify]
    if: needs.plan.outputs.reader == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Publish
        run: pnpm release:publish reader
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}

  resources:
    needs: [plan, verify]
    if: needs.plan.outputs.resources == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Publish
        run: pnpm release:publish resources
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}

  # A stable release deploys the production docs site from its release tag,
  # once every product of the run published. A tag pushed with GITHUB_TOKEN
  # starts no workflow, so this job calls the deploy itself.
  docs:
    needs: [plan, obsidian, zotero, reader, resources]
    if: >-
      always() && needs.plan.outputs.docs-tag != '' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
    uses: ./.github/workflows/docs-deploy.yml
    with:
      site: production
      ref: ${{ needs.plan.outputs.docs-tag }}
    secrets: inherit
