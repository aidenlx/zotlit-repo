name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      obsidian: ${{ steps.plan.outputs.obsidian }}
      zotero: ${{ steps.plan.outputs.zotero }}
      reader: ${{ steps.plan.outputs.reader }}
      resources: ${{ steps.plan.outputs.resources }}
      docs-tag: ${{ steps.plan.outputs.docs-tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          bootstrap: "false"

      - name: Find unreleased versions
        id: plan
        run: node packages/scripts/scripts/release-plan.ts >> "$GITHUB_OUTPUT"

  verify:
    needs: plan
    if: needs.plan.outputs.obsidian == 'true' || needs.plan.outputs.zotero == 'true' || needs.plan.outputs.reader == 'true' || needs.plan.outputs.resources == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Release gate
        run: pnpm verify --release

  obsidian:
    needs: [plan, verify]
    if: needs.plan.outputs.obsidian == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Publish
        run: pnpm release:publish obsidian
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}

  zotero:
    needs: [plan, verify]
    if: needs.plan.outputs.zotero == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Publish
        id: publish
        run: pnpm release:publish zotero
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}

      - name: Attest provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.publish.outputs.attest }}

  reader:
    needs: [plan, verify]
    if: needs.plan.outputs.reader == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Publish
        run: pnpm release:publish reader
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}

  resources:
    needs: [plan, verify]
    if: needs.plan.outputs.resources == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Publish
        run: pnpm release:publish resources
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}

  docs:
    needs: [plan, obsidian, zotero, reader, resources]
    if: >-
      always() && needs.plan.outputs.docs-tag != '' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
    uses: ./.github/workflows/docs-deploy.yml
    with:
      site: production
      ref: ${{ needs.plan.outputs.docs-tag }}
    secrets: inherit
