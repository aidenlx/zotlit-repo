name: Release

# Publishes each product whose version on its line's branch has no release
# tag yet: a pre-release from `next`, a stable version from `main`. The
# products publish to the publish repository, aidenlx/zotlit
# (RELEASE_REPOSITORY in packages/config/repositories.ts):
#
#   obsidian  the npm bundle package, then the shell commit and the version
#             tag in aidenlx/zotlit, whose own workflow builds and releases
#             the plugin; then the same tag here
#   zotero    the zt-<version> release and the rolling update channel in
#             aidenlx/zotlit; then the same tag here
#
# The steps live in packages/scripts/lib/release/ and run the same way from
# a machine (`pnpm release:publish`). Each skips what an earlier run did, so
# a run that failed half way runs again with workflow_dispatch. See
# CONTRIBUTING.md "Releasing".
on:
  push:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The release tags of this repository are the gate: a pushed branch whose
  # versions are tagged stops here, before any dependency is installed.
  plan:
    runs-on: ubuntu-latest
    outputs:
      obsidian: ${{ steps.plan.outputs.obsidian }}
      zotero: ${{ steps.plan.outputs.zotero }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          bootstrap: "false"

      - name: Find unreleased versions
        id: plan
        run: node packages/scripts/scripts/release-plan.ts --branch "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  # The release gate on the tree that ships. Its desktop checks skip here;
  # `pnpm release` ran them in its Land Turn.
  verify:
    needs: plan
    if: needs.plan.outputs.obsidian == 'true' || needs.plan.outputs.zotero == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Release gate
        run: pnpm verify --release

  obsidian:
    needs: [plan, verify]
    if: needs.plan.outputs.obsidian == 'true'
    runs-on: ubuntu-latest
    permissions:
      # The release tag of this repository.
      contents: write
      # npm trusted publishing and its provenance statement.
      id-token: write
    steps:
      # The full history: the run checks that it builds a commit of its branch.
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Publish
        run: pnpm release:publish obsidian --branch "$GITHUB_REF_NAME"
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}

  zotero:
    needs: [plan, verify]
    if: needs.plan.outputs.zotero == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Publish
        id: publish
        run: pnpm release:publish zotero --branch "$GITHUB_REF_NAME"
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}

      # The XPI and the channel manifests this run wrote
      # (apps/zotero/scripts/build-update-json.ts).
      - name: Attest provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.publish.outputs.attest }}
