name: Record PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: record-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  shard:
    name: Record PR shard ${{ matrix.shard }}
    strategy:
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Key of the Git LFS objects
        id: lfs
        run: echo "key=lfs-$(git lfs ls-files --long | cut -d' ' -f1 | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        with:
          path: .git/lfs
          key: ${{ steps.lfs.outputs.key }}
          restore-keys: lfs-
      - name: Git LFS objects
        run: git lfs pull

      - name: Team of the Turborepo Remote Cache
        id: turbo-team
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: echo "slug=$(jq -r '.remoteCache.teamSlug // empty' turbo.json)" >> "$GITHUB_OUTPUT"
      - name: Set up Turborepo Remote Cache
        if: steps.turbo-team.outputs.slug != ''
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ steps.turbo-team.outputs.slug }}

      - uses: ./.github/actions/setup-workspace

      - name: pnpm verify --pr
        run: pnpm verify --pr --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  tests:
    name: Record PR tests
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.shard.result }}
        run: test "$RESULT" = success
