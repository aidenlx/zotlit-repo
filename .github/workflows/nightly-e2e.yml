name: Nightly End-to-end Run

on:
  schedule:
    - cron: "20 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-e2e-main

jobs:
  e2e:
    if: github.ref == 'refs/heads/main'
    name: e2e (${{ matrix.shard.name }})
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: paired, args: --project=paired }
          - { name: desktop-1, args: --project=desktop --shard=1/2 }
          - { name: desktop-2, args: --project=desktop --shard=2/2 }
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace
        with:
          bootstrap: "false"
      - run: pnpm install --frozen-lockfile

      - name: Compute Run Container image tag
        id: image
        run: |
          tag=$(node packages/e2e/src/run-container.ts --image-tag)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v5
        id: image-cache
        with:
          path: ${{ runner.temp }}/zotlit-e2e-image.tar
          key: run-container-image-${{ steps.image.outputs.tag }}

      - uses: actions/cache/restore@v5
        id: store-cache
        with:
          path: ${{ runner.temp }}/zotlit-e2e-pnpm
          key: run-container-user-store-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: run-container-user-store-${{ runner.arch }}-

      - name: Run the ${{ matrix.shard.name }} shard
        id: e2e
        env:
          ZOTLIT_E2E_IMAGE_ARCHIVE: ${{ runner.temp }}/zotlit-e2e-image.tar
          ZOTLIT_E2E_RESULTS: ${{ runner.temp }}/nightly-e2e/evidence
          SHARD_ARGS: ${{ matrix.shard.args }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nightly-e2e"
          {
            mkdir -p "$RUNNER_TEMP/zotlit-e2e-pnpm" &&
            docker volume create "zotlit-e2e-pnpm-arm64-u$(id -u)" --opt type=none --opt o=bind --opt "device=$RUNNER_TEMP/zotlit-e2e-pnpm" &&
            read -ra shard_args <<<"$SHARD_ARGS" &&
            timeout --verbose --kill-after=30s 35m pnpm e2e "${shard_args[@]}"
          } 2>&1 | tee "$RUNNER_TEMP/nightly-e2e/console.log"

      - uses: actions/cache/save@v5
        if: "!cancelled() && matrix.shard.name == 'paired' && steps.e2e.outcome != 'skipped' && steps.image-cache.outputs.cache-hit != 'true'"
        with:
          path: ${{ runner.temp }}/zotlit-e2e-image.tar
          key: ${{ steps.image-cache.outputs.cache-primary-key }}

      - uses: actions/cache/save@v5
        if: "!cancelled() && matrix.shard.name == 'paired' && steps.e2e.outcome != 'skipped' && steps.store-cache.outputs.cache-hit != 'true'"
        with:
          path: ${{ runner.temp }}/zotlit-e2e-pnpm
          key: ${{ steps.store-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        if: "!cancelled() && steps.e2e.outcome != 'skipped'"
        with:
          name: e2e-evidence-${{ matrix.shard.name }}
          path: ${{ runner.temp }}/nightly-e2e

      - name: Report failures
        if: failure() && steps.e2e.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packages/scripts/scripts/report-nightly-e2e.ts
