name: Docs Deploy

# Deploys the docs site to Cloudflare Workers. There are two sites (ADR 0097):
#
#   pre-release  Pre-release Docs, the `beta` wrangler environment,
#                `zotlit-docs-beta`, on zotlit-beta.aidenlx.site. A push to
#                `main`, the trunk, deploys it.
#   production   the top-level wrangler config, `zotlit-docs`, on
#                zotlit.aidenlx.site. It deploys from the commit of a stable
#                release: release.yml calls this workflow with the release tag
#                after it publishes a stable version, and a dispatch deploys
#                it from the ref it names (default: the latest stable release
#                tag). A push deploys only the pre-release site.
#
# A push enters the gate job, which asks Turbo whether the push touched
# `@zotlit/docs` or anything in its dependency closure. An unaffected push
# stops at the gate; an affected push runs the deploy job. A call or a
# dispatch always deploys.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      site:
        description: The site to deploy
        type: choice
        options: [production, pre-release]
        default: production
      ref:
        description: "The commit, tag or branch to build (default: the latest stable release tag for production, main for pre-release)"
        type: string
        default: ""
  workflow_call:
    inputs:
      site:
        type: string
        required: true
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
      site: ${{ steps.target.outputs.site }}
      ref: ${{ steps.target.outputs.ref }}
    steps:
      # The gate compares the push base against HEAD, so it needs full history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The gate needs the pinned pnpm and Turbo versions, but an unaffected
      # push stops before dependency installation or package builds.
      - uses: ./.github/actions/setup-workspace
        with:
          bootstrap: "false"

      # The site and the commit to build. A push builds its own commit for
      # Pre-release Docs; a call or a dispatch names the site, and a
      # production deploy without a ref takes the latest stable release tag.
      - name: Pick the site and the ref
        id: target
        env:
          SITE: ${{ inputs.site || 'pre-release' }}
          REF: ${{ inputs.ref }}
        run: |
          if [ -z "$REF" ]; then
            if [ "$SITE" = "production" ]; then
              REF=$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
              if [ -z "$REF" ]; then
                echo "No stable release tag to deploy the production site from." >&2
                exit 1
              fi
            else
              REF="$GITHUB_SHA"
            fi
          fi
          echo "site=$SITE" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "target: the $SITE site from $REF"

      # Fail open: every path that cannot prove "docs untouched" deploys —
      # a manual dispatch, an unknown base commit, a force push, a change to
      # deployment machinery, or a Turbo failure.
      - name: Check whether the docs closure changed
        id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          deploy() { echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "gate: deploy — $1"; exit 0; }
          skip()   { echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "gate: skip — $1"; exit 0; }

          if [ -n "${{ inputs.site }}" ]; then
            deploy "call or manual dispatch"
          fi
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            deploy "base commit unavailable"
          fi
          if ! git merge-base --is-ancestor "$BEFORE" HEAD; then
            deploy "force push"
          fi
          if [ -n "$(git diff --name-only "$BEFORE" HEAD -- \
            .github/workflows/docs-deploy.yml \
            .github/actions/setup-workspace/action.yml)" ]; then
            deploy "deployment machinery changed"
          fi
          # The docs read the root message catalogs, which belong to no package,
          # so the package dry run below does not see an edit to them.
          if [ -n "$(git diff --name-only "$BEFORE" HEAD -- \
            messages project.inlang)" ]; then
            deploy "messages changed"
          fi

          # The dry run lists docs and its dependencies that changed since the
          # push base. The pinned version tracks the root devDependency.
          turbo_version=$(jq -r '.devDependencies.turbo' package.json | tr -d '^~')
          affected=$(pnpm dlx "turbo@${turbo_version}" run build \
            --filter="@zotlit/docs...[$BEFORE]" --dry=json 2>/dev/null \
            | jq '.packages | length') || affected=""
          if [ -z "$affected" ]; then
            deploy "Turbo dry run failed"
          fi
          if [ "$affected" -gt 0 ]; then
            deploy "$affected affected package(s)"
          fi
          skip "docs closure untouched"

  deploy:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # One deploy at a time per site: a queued run would otherwise overwrite a
    # newer build, while the two sites deploy independently of each other.
    concurrency:
      group: docs-deploy-${{ needs.gate.outputs.site }}
      cancel-in-progress: true
    env:
      # The wrangler environment of the site: `beta` for Pre-release Docs,
      # empty for the production site, which is the top-level config.
      WRANGLER_ENV: ${{ needs.gate.outputs.site == 'pre-release' && 'beta' || '' }}
    steps:
      # The docs build reads each page's last commit date from git history and
      # each image's bytes from Git LFS, so both must be present before Vite.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.ref }}
          fetch-depth: 0
          lfs: true

      # Seeds the Git LFS cache that the record-PR job restores (see
      # record-pr.yml): this checkout has already downloaded every object,
      # and a cache saved on main is readable by every PR. The key is the
      # same hash of the LFS object list; an existing key is kept.
      - name: Key of the Git LFS objects
        if: github.ref == 'refs/heads/main'
        id: lfs
        run: echo "key=lfs-$(git lfs ls-files --long | cut -d' ' -f1 | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: .git/lfs
          key: ${{ steps.lfs.outputs.key }}

      # The docs build installs its own dependency closure below, so the
      # workspace-wide bootstrap stays off.
      - uses: ./.github/actions/setup-workspace
        with:
          bootstrap: "false"

      - name: Install docs dependencies
        run: pnpm install --frozen-lockfile --filter @zotlit/docs...

      # `CLOUDFLARE_ENV` picks the Cloudflare environment at build time, so the
      # beta build has to be its own; a build made without it carries the
      # production site's variables whatever `wrangler deploy --env` says.
      - name: Build
        run: |
          if [ -n "$WRANGLER_ENV" ]; then
            export CLOUDFLARE_ENV="$WRANGLER_ENV"
          fi
          pnpm turbo run build --filter=@zotlit/docs
        env:
          # Public Cloudflare Web Analytics site token; without it the built
          # site serves no beacon. Each site reports to its own analytics
          # site, so the two sites' numbers stay apart.
          VITE_CF_BEACON_TOKEN: ${{ needs.gate.outputs.site == 'pre-release' && vars.CF_BEACON_TOKEN_BETA || vars.CF_BEACON_TOKEN }}
          # The recordings' videos play from the media store, the R2 bucket
          # `zotlit-docs-media` on this domain, which both sites share; the
          # build points the players there and leaves the videos out of the
          # Worker's assets.
          VITE_MEDIA_ORIGIN: https://zotlit-media.aidenlx.site

      # The built pages name each video by a content-hashed key, so every key
      # must be in the bucket before the deploy makes those pages live. The
      # step sends only the keys the bucket lacks, with a token scoped to that
      # bucket.
      - name: Upload media
        run: pnpm --filter @zotlit/docs upload:media
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: |
          if [ -n "$WRANGLER_ENV" ]; then
            pnpm --filter @zotlit/docs exec wrangler deploy --env "$WRANGLER_ENV"
          else
            pnpm --filter @zotlit/docs exec wrangler deploy
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
