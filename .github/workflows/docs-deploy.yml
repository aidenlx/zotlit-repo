name: Docs Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      site:
        description: The site to deploy
        type: choice
        options: [production, pre-release]
        default: production
      ref:
        description: "The commit, tag or branch to build (default: the latest stable release tag for production, main for pre-release)"
        type: string
        default: ""
  workflow_call:
    inputs:
      site:
        type: string
        required: true
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
      site: ${{ steps.target.outputs.site }}
      ref: ${{ steps.target.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace
        with:
          bootstrap: "false"

      - name: Pick the site and the ref
        id: target
        env:
          SITE: ${{ inputs.site || 'pre-release' }}
          REF: ${{ inputs.ref }}
        run: |
          if [ -z "$REF" ]; then
            if [ "$SITE" = "production" ]; then
              REF=$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
              if [ -z "$REF" ]; then
                echo "No stable release tag to deploy the production site from." >&2
                exit 1
              fi
            else
              REF="$GITHUB_SHA"
            fi
          fi
          echo "site=$SITE" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "target: the $SITE site from $REF"

      - name: Check whether the docs closure changed
        id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          deploy() { echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "gate: deploy — $1"; exit 0; }
          skip()   { echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "gate: skip — $1"; exit 0; }

          if [ -n "${{ inputs.site }}" ]; then
            deploy "call or manual dispatch"
          fi
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            deploy "base commit unavailable"
          fi
          if ! git merge-base --is-ancestor "$BEFORE" HEAD; then
            deploy "force push"
          fi
          if [ -n "$(git diff --name-only "$BEFORE" HEAD -- \
            .github/workflows/docs-deploy.yml \
            .github/actions/setup-workspace/action.yml)" ]; then
            deploy "deployment machinery changed"
          fi
          # The docs read the root message catalogs, which belong to no package,
          # so the package dry run below does not see an edit to them.
          if [ -n "$(git diff --name-only "$BEFORE" HEAD -- \
            messages project.inlang)" ]; then
            deploy "messages changed"
          fi

          # The dry run lists docs and its dependencies that changed since the
          # push base. The pinned version tracks the root devDependency.
          turbo_version=$(jq -r '.devDependencies.turbo' package.json | tr -d '^~')
          affected=$(pnpm dlx "turbo@${turbo_version}" run build \
            --filter="@zotlit/docs...[$BEFORE]" --dry=json 2>/dev/null \
            | jq '.packages | length') || affected=""
          if [ -z "$affected" ]; then
            deploy "Turbo dry run failed"
          fi
          if [ "$affected" -gt 0 ]; then
            deploy "$affected affected package(s)"
          fi
          skip "docs closure untouched"

  deploy:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: docs-deploy-${{ needs.gate.outputs.site }}
      cancel-in-progress: true
    env:
      WRANGLER_ENV: ${{ needs.gate.outputs.site == 'pre-release' && 'beta' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.ref }}
          fetch-depth: 0
          lfs: true

      - name: Key of the Git LFS objects
        if: github.ref == 'refs/heads/main'
        id: lfs
        run: echo "key=lfs-$(git lfs ls-files --long | cut -d' ' -f1 | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: .git/lfs
          key: ${{ steps.lfs.outputs.key }}

      - uses: ./.github/actions/setup-workspace
        with:
          bootstrap: "false"

      - name: Install docs dependencies
        run: pnpm install --frozen-lockfile --filter @zotlit/docs...

      - name: Build
        run: |
          if [ -n "$WRANGLER_ENV" ]; then
            export CLOUDFLARE_ENV="$WRANGLER_ENV"
          fi
          if [ "$SITE" = pre-release ]; then
            export VITE_CF_BEACON_TOKEN="$CF_BEACON_TOKEN_BETA"
          else
            export VITE_CF_BEACON_TOKEN="$CF_BEACON_TOKEN"
          fi
          pnpm turbo run build --filter=@zotlit/docs
        env:
          SITE: ${{ needs.gate.outputs.site }}
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
          CF_BEACON_TOKEN_BETA: ${{ vars.CF_BEACON_TOKEN_BETA }}
          VITE_MEDIA_ORIGIN: https://zotlit-media.aidenlx.site

      - name: Upload media
        run: pnpm --filter @zotlit/docs upload:media
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: |
          if [ -n "$WRANGLER_ENV" ]; then
            pnpm --filter @zotlit/docs exec wrangler deploy --env "$WRANGLER_ENV"
          else
            pnpm --filter @zotlit/docs exec wrangler deploy
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
