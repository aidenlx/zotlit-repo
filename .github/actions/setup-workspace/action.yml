name: Set up workspace
description: Set up the pinned toolchain and restore pnpm and Turborepo caches.

inputs:
  bootstrap:
    description: Run the full workspace bootstrap after cache restoration.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v4

    - uses: pnpm/action-setup@v6
      with:
        cache: true

    - name: Restore Turborepo cache
      uses: actions/cache@v5
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-
          turbo-${{ runner.os }}-

    - name: Record toolchain identity
      shell: bash
      run: echo "ZOTLIT_TOOLCHAIN=node-$(node --version)" >> "$GITHUB_ENV"

    - name: Bootstrap workspace
      if: inputs.bootstrap == 'true'
      shell: bash
      run: mise run init
