pre-start = "{ [ -z \"$AI_AGENT$CLAUDE_CODE$CLAUDECODE$CODEX_SANDBOX$CODEX_THREAD_ID\" ] || { p={{ primary_worktree_path }}; if [ -f \"$p/packages/scripts/scripts/worktree-owner.ts\" ]; then node \"$p/packages/scripts/scripts/worktree-owner.ts\" mark || echo 'warning: could not write the owner mark of this worktree, so no agent session can remove it' >&2; else echo \"warning: wrote no owner mark for this worktree: the worktree guard is not in the primary checkout at $p; update that checkout to main\" >&2; fi; }; }; mise trust && mise run init {{ primary_worktree_path }}"

pre-remove = "{ [ -z \"$AI_AGENT$CLAUDE_CODE$CLAUDECODE$CODEX_SANDBOX$CODEX_THREAD_ID\" ] || [ -n \"$ZOTLIT_WT_PERSON\" ] || { p={{ primary_worktree_path }}; [ -f \"$p/packages/scripts/scripts/worktree-owner.ts\" ] || { echo \"the worktree guard is not in the primary checkout at $p; update that checkout to main\" >&2; exit 1; }; node \"$p/packages/scripts/scripts/worktree-owner.ts\" check; }; } && { node packages/scripts/scripts/fixture.ts stop || echo \"warning: could not stop the Paired Zotero of this worktree. Find it with: pgrep -fl '$PWD/.scratch/'\" >&2; } && { node packages/scripts/scripts/obsidian-vault.ts remove --purge || true; }"
