min_version = "2024.9.5"

[tools]
node = "26.13.1"
"npm:cf" = "1.0.0-rc.4"
"npm:zx" = "8"
worktrunk = "0.80"

[settings]
idiomatic_version_file_enable_tools = ["pnpm"]

[env]
_.path = ['{{config_root}}/node_modules/.bin']
# Turbo's globalEnv: the Mac and CI share one Remote Cache, and a machine can
# run another Node than the one this file pins. The root
# package.json, also in the global hash, pins pnpm. The setup-workspace action
# writes the same value in CI.
ZOTLIT_TOOLCHAIN = { value = "node-{{ exec(command='node --version') }}", tools = true }

[tasks.init]
description = "Bootstrap a fresh clone: trust mise, install deps; pass a primary-worktree path to also copy .env* files"
run = "zx packages/scripts/scripts/init.ts"

[tasks."video:clone"]
description = "Clone the private video workbench into video/; needs read access to aidenlx/zotlit-video"
run = "git clone --branch main https://github.com/aidenlx/zotlit-video.git video"
